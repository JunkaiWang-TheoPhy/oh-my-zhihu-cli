[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oh-my-zhihu-cli"
version = "0.3.0"
description = "AGPL-3.0 Zhihu CLI with read-only drafts, profiles, backups, and guarded writes"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Junkai Wang" }]
keywords = ["zhihu", "cli", "知乎"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "qrcode>=7.4",
    "click>=8.0",
    "rich>=13.0",
    "pillow>=12.1.1",
]

[project.urls]
Homepage = "https://github.com/JunkaiWang-TheoPhy/oh-my-zhihu-cli"
Repository = "https://github.com/JunkaiWang-TheoPhy/oh-my-zhihu-cli"
Upstream = "https://github.com/BAIGUANGMEI/zhihu-cli"

[project.scripts]
zhihu = "zhihu_cli.cli:cli"
zhihu-tui = "zhihu_cli.cli:tui_entry"
zhihu-api = "zhihu_cli.commands.official:api"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["zhihu_cli"]

[tool.pytest.ini_options]
markers = [
    "integration: requires valid login session",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
